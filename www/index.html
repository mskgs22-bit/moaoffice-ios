<style>
:root{--pri:#1a5ee9;--pri2:#e7effd;--bg:#f5f6f7;--card:#fff;--tx:#1d2125;--sub:#7a8188;--line:#e8eaed;--red:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,select{font:inherit}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:var(--adh,0px)}
#view{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px}
header.top{display:flex;align-items:center;gap:6px;padding:10px 10px;background:var(--card);border-bottom:1px solid var(--line);min-height:54px}
header.top h1{flex:1;font-size:17px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.ib{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center}
.ib:active{background:#0000000d}
.hero{padding:16px 16px 6px}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}.brand img{width:40px;height:40px;border-radius:11px}.brand b{font-size:19px;letter-spacing:-.3px}
.searchbox{display:flex;align-items:center;gap:8px;background:#ebedef;border-radius:12px;padding:10px 12px;color:var(--sub)}
.searchbox input{border:0;background:none;outline:none;flex:1;color:var(--tx)}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 4px;padding:16px 8px}
.tool{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13px;text-align:center;line-height:1.25}
.tool .ci{width:54px;height:54px;border-radius:27px;display:flex;align-items:center;justify-content:center}
.tool:active .ci{transform:scale(.94)}

async function saveFile(name,data){
  const blob=data instanceof Blob?data:new Blob([data]);
  if(NATIVE){try{await nativeSave(name,blob)}catch(e){toast('저장하지 못했어요: '+(e&&e.message||e),3500)}showInter();return}
  await Promise.race([dlReady,sleep(1500)]);
  if(dlNs){try{await dlNs.save({filename:name,data:blob});toast('저장했어요: '+name)}catch(e){if(e&&e.code==='declined')toast('저장을 취소했어요');else toast('저장할 수 없어요 ('+(e&&e.code||'오류')+')',3000)}return}

      rr(x0,y0,bw,hh,[r,r,0,0]);x.fillStyle='#1a5ee9';x.fill();x.fillStyle='#fff';x.font=`600 ${fL}px sans-serif`;x.textAlign='center';x.textBaseline='middle';x.fillText(o.label||'촬영 시각',x0+bw/2,y0+hh/2);
      x.fillStyle='#16191c';x.font=`700 ${fT}px sans-serif`;x.fillText(o.time,x0+bw/2,y0+hh+th/2+fT*0.04);
      x.textAlign='left';x.font=`600 ${fD}px sans-serif`;x.shadowColor='rgba(0,0,0,.8)';x.shadowBlur=u*0.012;x.fillStyle='#fff';x.fillText(o.date,x0+2,y0+hh+th+dh/2+2)}
    else if(o.type==='ts'){const fs=Math.max(11,W*0.028);x.font=`600 ${fs}px sans-serif`;const tw=x.measureText(o.text).width;const p=fs*.5,bw=tw+p*2,bh=fs+p*1.6;const m=W*0.03;
      const pos=o.pos||'br';const bx=pos.includes('r')?W-m-bw:m,by=pos.includes('b')?H-m-bh:m;x.fillStyle='rgba(255,255,255,.85)';x.fillRect(bx,by,bw,bh);x.fillStyle=o.color||'#e0352b';x.textBaseline='middle';x.fillText(o.text,bx+p,by+bh/2)}
    x.restore()}
  return c}
async function warpedBase(page){const im=await loadImg(page.raw);const c=imgToCanvas(im);return isFull(page.quad,c.width,c.height)?c:warp(c,page.quad)}
async function renderPage(page,{overlays=true,warped=null}={}){let c=warped?copyCanvas(warped):await warpedBase(page);c=rotateCanvas(c,page.rot||0);applyFilter(c,page.filter);if(overlays)await drawOverlays(c,page.overlays);return c}
async function bakePage(page,warped){const c=await renderPage(page,{warped});page.out=await toBlob(c,'image/jpeg',0.9);page.w=c.width;page.h=c.height;const s=Math.min(1,360/c.width);const t=mkCanvas(c.width*s,c.height*s);t.getContext('2d').drawImage(c,0,0,t.width,t.height);page.thumb=await toBlob(t,'image/jpeg',0.8);return page}
function newPage(raw,w,h,quad,filter='orig'){return{id:uid(),raw,quad:quad||fullQuad(w,h),rot:0,filter,overlays:[]}}

/* ---------- PDF ---------- */
function needLib(name,glob){if(!window[glob])throw new Error(name+' 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');return window[glob]}
async function openPdf(buf){const lib=needLib('PDF','pdfjsLib');return await lib.getDocument({data:new Uint8Array(buf.slice(0)),isEvalSupported:false}).promise}
async function renderPdfPage(pdf,n,targetW){const p=await pdf.getPage(n);const v1=p.getViewport({scale:1});const sc=targetW/v1.width;const vp=p.getViewport({scale:sc});const c=mkCanvas(vp.width,vp.height);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await p.render({canvasContext:x,viewport:vp}).promise;return{canvas:c,ptW:v1.width,ptH:v1.height}}
async function embedImage(pdf,blob){const bytes=new Uint8Array(await blob.arrayBuffer());if(blob.type==='image/png')return pdf.embedPng(bytes);if(blob.type==='image/jpeg'||blob.type==='image/jpg')return pdf.embedJpg(bytes);const im=await loadImg(blob);const c=imgToCanvas(im,3000);return pdf.embedJpg(new Uint8Array(await (await toBlob(c,'image/jpeg',0.92)).arrayBuffer()))}
async function docToPdf(doc,mode){const L=needLib('PDF','PDFLib');const pdf=await L.PDFDocument.create();pdf.setTitle(doc.name);pdf.setCreator('포켓 스캐너');
  for(const p of doc.pages){let blob=p.out;if(mode==='small'){const im=await loadImg(p.out);const c=imgToCanvas(im,1400);blob=await toBlob(c,'image/jpeg',0.6)}
    const img=await pdf.embedJpg(new Uint8Array(await blob.arrayBuffer()));
    if(mode==='a4'){const land=img.width>img.height;const PW=land?841.89:595.28,PH=land?595.28:841.89;const s=Math.min(PW/img.width,PH/img.height);const w=img.width*s,h=img.height*s;const pg=pdf.addPage([PW,PH]);pg.drawImage(img,{x:(PW-w)/2,y:(PH-h)/2,width:w,height:h})}
    else{const PW=595.28,PH=PW*img.height/img.width;const pg=pdf.addPage([PW,PH]);pg.drawImage(img,{x:0,y:0,width:PW,height:PH})}}
  return new Blob([await pdf.save()],{type:'application/pdf'})}
async function exportDocImages(doc){if(doc.pages.length===1){await saveFile(safeName(doc.name)+'.jpg',doc.pages[0].out);return}
  const Z=needLib('ZIP','JSZip');const z=new Z();doc.pages.forEach((p,i)=>z.file(`${safeName(doc.name)}_${pad(i+1)}.jpg`,p.out));const b=await z.generateAsync({type:'blob'});await saveFile(safeName(doc.name)+'.zip',b)}

/* ---------- print ---------- */
async function printPdf(pages,{margin=28,per=1}){const L=needLib('PDF','PDFLib');const pdf=await L.PDFDocument.create();const imgs=[];
  for(const p of pages)imgs.push(await pdf.embedJpg(new Uint8Array(await p.out.arrayBuffer())));
  const place=(pg,img,x,y,w,h)=>{const s=Math.min(w/img.width,h/img.height);const iw=img.width*s,ih=img.height*s;pg.drawImage(img,{x:x+(w-iw)/2,y:y+(h-ih)/2,width:iw,height:ih})};
  if(per===2){for(let i=0;i<imgs.length;i+=2){const PW=841.89,PH=595.28;const pg=pdf.addPage([PW,PH]);const cw=(PW-margin*3)/2;place(pg,imgs[i],margin,margin,cw,PH-margin*2);if(imgs[i+1])place(pg,imgs[i+1],margin*2+cw,margin,cw,PH-margin*2)}}
  else for(const img of imgs){const land=img.width>img.height*1.1;const PW=land?841.89:595.28,PH=land?595.28:841.89;place(pdf.addPage([PW,PH]),img,margin,margin,PW-margin*2,PH-margin*2)}
  return new Blob([await pdf.save()],{type:'application/pdf'})}
function directPrint(pages,{per=1,margin='m'}={}){const old=$('#printbox');if(old){$$('img',old).forEach(i=>URL.revokeObjectURL(i.src));old.remove()}const os=$('#printstyle');if(os)os.remove();
  const mg=margin==='n'?4:12,land=per===2;const ph=(land?210:297)-mg*2-1;
  const st=document.createElement('style');st.id='printstyle';st.textContent=`@media print{@page{size:A4 ${land?'landscape':'portrait'};margin:${mg}mm}#printbox .pp{height:${ph}mm}}`;document.head.appendChild(st);
  const groups=[];for(let i=0;i<pages.length;i+=per)groups.push(pages.slice(i,i+per));
  const box=document.createElement('div');box.id='printbox';box.innerHTML=groups.map(g=>`<div class="pp ${per===2?'two':''}">${g.map(p=>`<img src="${URL.createObjectURL(p.out)}">`).join('')}</div>`).join('');document.body.appendChild(box);
  const imgs=[...box.querySelectorAll('img')];Promise.all(imgs.map(i=>i.decode().catch(()=>{}))).then(async()=>{
    if(NATIVE){try{await plug('WebPrint').print({name:'PocketScanner'})}catch(e){toast('인쇄를 열 수 없어요: '+(e&&e.message||e),3500)}}else window.print()})}
const framed=(()=>{try{return window.self!==window.top}catch(e){return true}})();
async function printFlow(d,pids){const pages=d.pages.filter(p=>!pids||pids.includes(p.id));if(!pages.length)return toast('페이지가 없어요');
  const k=await sheet(`인쇄 (${pages.length}페이지)`,[{key:'m',label:'A4 · 여백 보통',sub:'일반 문서',icon:'printer'},{key:'n',label:'A4 · 여백 없이 크게',sub:'영수증·사진',icon:'printer'},{key:'2',label:'A4 한 장에 2페이지',sub:'종이 절약',icon:'pages'}]);if(!k)return;
  if(!framed){directPrint(pages,{per:k==='2'?2:1,margin:k});setTimeout(showInter,4000);return}
  let blob;await withBusy('인쇄용 PDF 만드는 중…',async()=>{blob=await printPdf(pages,{margin:k==='n'?8:28,per:k==='2'?2:1})});if(!blob)return;
  await saveFile(safeName(d.name)+'_인쇄용.pdf',blob);
  await dialog('이제 인쇄하세요',`<div class="muted" style="font-size:14.5px;line-height:1.7">1. 방금 저장한 <b>${esc(safeName(d.name))}_인쇄용.pdf</b>를 여세요.<br>2. <b>공유</b> 또는 <b>⋮ 메뉴</b>에서 <b>인쇄</b>를 누르세요.<br>3. 프린터를 고르고 인쇄하면 끝!<br><br>와이파이 프린터나 삼성·HP 프린터 앱이 있으면 바로 보낼 수 있어요.</div>`,[{label:'확인',cls:'pri',value:true}])}

function bindActs(root){$$('[data-act]',root).forEach(b=>b.onclick=()=>runAction(b.dataset.act))}
async function runAction(k){
  switch(k){
  case 'scan':return startScan(null,'scan');
  case 'slide':case 'board':case 'book':case 'idphoto':return startScan(null,k);
  case 'camts':return startScan(null,'ts');
  case 'idcard':return go('idcard',{});
  case 'gallery':return importImages(null,true);
  case 'importImg':return importImages(null,false);
  case 'importPdf':return importPdfAsDoc(null);
  case 'qrscan':return go('qrscan');
  case 'qrmake':return go('qrmake');
  case 'merge':return go('merge');
  case 'pdfpages':return go('pdfpages');
  case 'img2pdf':{const fs=await pickFiles({accept:'image/*',multiple:true});if(!fs.length)return;
    await withBusy('PDF 만드는 중…',async()=>{const d=newDoc('이미지 PDF '+nowStr());for(const f of fs){const n=await normalizeImage(f);const p=newPage(n.blob,n.w,n.h);await bakePage(p);d.pages.push(p)}await saveDoc(d);const pdf=await docToPdf(d,'fit');unbusy();await saveFile(safeName(d.name)+'.pdf',pdf);stack=[{name:curTab},{name:'doc',args:{id:d.id}}];render()});return}
  case 'pdf2img':{const fs=await pickFiles({accept:'application/pdf'});if(!fs.length)return;
    await withBusy('이미지로 바꾸는 중…',async()=>{const pdf=await openPdf(await fs[0].arrayBuffer());const base=safeName(fs[0].name.replace(/\.pdf$/i,''));const outs=[];
      for(let i=1;i<=pdf.numPages;i++){busy(`페이지 ${i}/${pdf.numPages} 변환 중…`);const r=await renderPdfPage(pdf,i,1800);outs.push(await toBlob(r.canvas,'image/jpeg',0.9))}
      unbusy();if(outs.length===1)return saveFile(base+'.jpg',outs[0]);const Z=needLib('ZIP','JSZip');const z=new Z();outs.forEach((b,i)=>z.file(`${base}_${pad(i+1)}.jpg`,b));await saveFile(base+'_images.zip',await z.generateAsync({type:'blob'}))});return}
  case 'compress':return go('compress');
  case 'print':{const pick=await sheet('무엇을 인쇄할까요?',[...(DOCS.length?[{key:'doc',label:'내 문서',icon:'folder'}]:[]),{key:'img',label:'이미지 파일',icon:'image'},{key:'pdf',label:'PDF 파일',icon:'pdf'}]);if(!pick)return;

  case 'sign':case 'watermark':case 'timestamp':{

async function importImages(docId,detect,returnId=false){
  const fs=await pickFiles({accept:'image/*',multiple:true});if(!fs.length)return null;
  let id=null;await withBusy('가져오는 중…',async()=>{const d=docId?getDoc(docId):newDoc((detect?'스캔 ':'이미지 ')+nowStr());let i=0;
    for(const f of fs){busy(`가져오는 중… ${++i}/${fs.length}`);const n=await normalizeImage(f);const p=newPage(n.blob,n.w,n.h,null,detect?'enhance':'orig');if(detect){p.quad=detectQuad(await loadImg(n.blob))}await bakePage(p);d.pages.push(p)}
    await saveDoc(d);id=d.id});
  if(!id)return null;if(returnId)return id;

    for(let i=1;i<=pdf.numPages;i++){busy(`페이지 ${i}/${pdf.numPages} 가져오는 중…`);const r=await renderPdfPage(pdf,i,1600);const b=await toBlob(r.canvas,'image/jpeg',0.9);const p=newPage(b,r.canvas.width,r.canvas.height);await bakePage(p,r.canvas);d.pages.push(p)}
    await saveDoc(d);id=d.id});

 hds.forEach(hd=>{const i=+hd.dataset.i;hd.onpointerdown=e=>{e.preventDefault();hd.setPointerCapture(e.pointerId);const r=cw.getBoundingClientRect();const st={x:e.clientX,y:e.clientY,qx:q[i][0],qy:q[i][1]};lp.style.display='block';
   const mv=ev=>{q[i][0]=Math.max(0,Math.min(W,st.qx+(ev.clientX-st.x)/k));q[i][1]=Math.max(0,Math.min(H,st.qy+(ev.clientY-st.y)/k));draw();

const CODE_SECRET_HEX='8228047cb360cc5c7142663330d13bb985b361524968cc45f0e8843260cb4b39';
const CODE_PLANS=[{k:'w1',l:'1주일',days:7},{k:'m1',l:'1개월',days:30},{k:'m6',l:'6개월',days:182},{k:'y1',l:'1년',days:365},{k:'inf',l:'영구',days:-1}];
const CODE_EPOCH=Date.UTC(2025,0,1);const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const SHA_K=new Uint32Array([0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
function sha256(m){const l=m.length,nb=((l+9+63)>>6)<<6;const b=new Uint8Array(nb);b.set(m);b[l]=0x80;const dv=new DataView(b.buffer);dv.setUint32(nb-4,(l*8)>>>0);dv.setUint32(nb-8,Math.floor(l*8/4294967296));
 const H=new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);const W=new Uint32Array(64);
 for(let o=0;o<nb;o+=64){for(let i=0;i<16;i++)W[i]=dv.getUint32(o+i*4);for(let i=16;i<64;i++){const a=W[i-15],c=W[i-2];const s0=((a>>>7)|(a<<25))^((a>>>18)|(a<<14))^(a>>>3);const s1=((c>>>17)|(c<<15))^((c>>>19)|(c<<13))^(c>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)|0}
  let a=H[0],bb=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
  for(let i=0;i<64;i++){const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));const ch=(e&f)^(~e&g);const t1=(h+S1+ch+SHA_K[i]+W[i])|0;const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));const mj=(a&bb)^(a&c)^(bb&c);const t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0}
  H[0]+=a;H[1]+=bb;H[2]+=c;H[3]+=d;H[4]+=e;H[5]+=f;H[6]+=g;H[7]+=h}
 const out=new Uint8Array(32);const ov=new DataView(out.buffer);for(let i=0;i<8;i++)ov.setUint32(i*4,H[i]);return out}
const u8cat=(...a)=>{const o=new Uint8Array(a.reduce((s,x)=>s+x.length,0));let p=0;for(const x of a){o.set(x,p);p+=x.length}return o};
const utf8=s=>new TextEncoder().encode(s);
const hex2u8=h=>new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));
function hmac256(key,msg){const k=key.length>64?sha256(key):key;const kb=new Uint8Array(64);kb.set(k);return sha256(u8cat(kb.map(x=>x^0x5c),sha256(u8cat(kb.map(x=>x^0x36),msg))))}
function b32enc(bytes){let bits=0,val=0,out='';for(const b of bytes){val=(val<<8)|b;bits+=8;while(bits>=5){out+=B32[(val>>>(bits-5))&31];bits-=5}}if(bits>0)out+=B32[(val<<(5-bits))&31];return out}
function b32dec(str){let bits=0,val=0;const out=[];for(const ch of str){const v=B32.indexOf(ch);if(v<0)return null;val=((val<<5)|v)&0xffff;bits+=5;if(bits>=8){out.push((val>>>(bits-8))&255);bits-=8}}return new Uint8Array(out)}
const normCode=s=>String(s||'').toUpperCase().replace(/[^0-9A-Z]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1').replace(/U/g,'V');
const fmtCode=s=>s.match(/.{1,5}/g).join('-');
const todayDay=(t=Date.now())=>Math.floor((t-CODE_EPOCH)/864e5);
function codeMac(p4,dev){return hmac256(hex2u8(CODE_SECRET_HEX),u8cat(p4,utf8(dev?normCode(dev):'*'))).slice(0,5)}
function makeCode(planIdx,dev,day=todayDay(),nonce=Math.floor(Math.random()*1024)){const bound=dev?1:0;const v=((1&3)<<30)|((planIdx&7)<<27)|(bound<<26)|((day&0xffff)<<10)|(nonce&1023);
  const p4=new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);return fmtCode(b32enc(u8cat(p4,codeMac(p4,dev))))}
function readCode(code,dev){const c=normCode(code);if(c.length!==15)return{ok:false,why:'코드 길이가 맞지 않아요'};const b=b32dec(c);if(!b||b.length<9)return{ok:false,why:'잘못된 코드예요'};
  const p4=b.slice(0,4),mac=b.slice(4,9);const v=((p4[0]<<24)|(p4[1]<<16)|(p4[2]<<8)|p4[3])>>>0;const ver=v>>>30,plan=(v>>>27)&7,bound=(v>>>26)&1,day=(v>>>10)&0xffff;
  if(ver!==1||plan>=CODE_PLANS.length)return{ok:false,why:'잘못된 코드예요'};const exp=codeMac(p4,bound?dev:null);
  if(exp.some((x,i)=>x!==mac[i]))return{ok:false,why:bound?'이 기기용 코드가 아니거나 잘못된 코드예요':'잘못된 코드예요'};return{ok:true,plan,bound:!!bound,day,code:c}}

/* ---------- 프로 상태 ---------- */
function effNow(){const n=Date.now();const last=lsGet('lastNow',0);if(n>last)lsSet('lastNow',n);return Math.max(n,last)}
function codeUntil(){return lsGet('proUntil',0)}
function subOwned(){const s=lsGet('subOwned',null);return !!(s&&s.v&&Date.now()-s.t<4*864e5)}
function isPro(){const u=codeUntil();return subOwned()||u===-1||u>effNow()}
function proLabel(){if(subOwned())return'구독 중';const u=codeUntil();if(u===-1)return'영구 이용권';if(u>effNow()){const d=new Date(u);return`${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}까지`}return''}
function redeemCode(input){const r=readCode(input,null);if(!r.ok)return r;
  const used=lsGet('usedCodes',[]);if(used.includes(r.code))return{ok:false,why:'이미 등록한 코드예요'};
  if(todayDay(effNow())-r.day>CONFIG.codeRedeemDays)return{ok:false,why:'등록 기간이 지난 코드예요'};
  const P=CODE_PLANS[r.plan];let u=codeUntil();
  if(P.days===-1)u=-1;else if(u!==-1){u=Math.max(u,effNow())+P.days*864e5}
  lsSet('proUntil',u);used.push(r.code);lsSet('usedCodes',used.slice(-200));setBanner(false);return{ok:true,plan:P}}

async function adsInit(){if(!NATIVE||isPro())return;const A=plug('AdMob');if(!A)return;

async function prepInter(){try{await plug('AdMob').prepareInterstitial({adId:CONFIG.adInter,isTesting:CONFIG.adTesting});interLoaded=true}catch(e){interLoaded=false}}
async function showInter(){if(!adReady||isPro())return;if(Date.now()-lastInter<CONFIG.interGapSec*1000)return;if(!interLoaded){prepInter();return}
  interLoaded=false;lastInter=Date.now();try{await plug('AdMob').showInterstitial()}catch(e){}setTimeout(prepInter,1000)}

  try{if(on){if(!bannerMade){bannerMade=true;await A.showBanner({adId:CONFIG.adBanner,adSize:'ADAPTIVE_BANNER',position:'BOTTOM_CENTER',margin:0,isTesting:CONFIG.adTesting})}else await A.resumeBanner()}

let billing=null;
async function billingInit(){if(!NATIVE)return;const t0=Date.now();while(!window.CdvPurchase&&Date.now()-t0<8000)await sleep(300);if(!window.CdvPurchase)return;
  try{const {store,ProductType,Platform}=CdvPurchase;
    const PF=IOS?Platform.APPLE_APPSTORE:Platform.GOOGLE_PLAY;
    store.register([{id:CONFIG.subMonthly,type:ProductType.PAID_SUBSCRIPTION,platform:PF},{id:CONFIG.subYearly,type:ProductType.PAID_SUBSCRIPTION,platform:PF}]);
    store.when().approved(t=>t.verify()).verified(r=>r.finish()).receiptUpdated(refreshSub).productUpdated(refreshSub);
    await store.initialize([PF]);billing=store;refreshSub()}catch(e){console.warn('billing',e)}}
function refreshSub(){if(!billing)return;const own=billing.owned(CONFIG.subMonthly)||billing.owned(CONFIG.subYearly);const was=isPro();lsSet('subOwned',{v:own,t:Date.now()});
  if(own){setBanner(false);if(!was){toast('프로가 시작됐어요! 광고가 사라져요',3000);const top=stack[stack.length-1];if(top.name==='pro'||top.name==='me')render()}}}
function storePrice(id,fb){try{const p=billing&&billing.get(id);const o=p&&p.getOffer();const ph=o&&o.pricingPhases&&o.pricingPhases[0];return ph&&ph.price?ph.price:fb}catch(e){return fb}}
async function buy(which){if(!NATIVE)return toast('앱에서만 결제할 수 있어요');if(!billing)return toast('결제를 준비하지 못했어요. 인터넷 연결을 확인하고 다시 시도하세요',3500);
  const p=billing.get(which==='y'?CONFIG.subYearly:CONFIG.subMonthly);const o=p&&p.getOffer();if(!o)return toast('상품 정보를 불러오지 못했어요',3000);
  try{const err=await o.order();if(err&&err.code!==CdvPurchase.ErrorCode.PAYMENT_CANCELLED)toast('결제 실패: '+err.message,3500)}catch(e){toast('결제 실패',3000)}}
async function restoreBuy(){if(!billing)return toast('결제를 준비하지 못했어요');await withBusy('구매 내역 확인 중…',async()=>{await billing.restorePurchases();refreshSub()});toast(isPro()?'프로가 복원됐어요':'복원할 구독이 없어요')}

  <button class="opt" id="ct" style="display:flex;gap:14px;width:100%;padding:14px 16px;text-align:left">${ic('edit')}<span>문의하기</span></button>
 </div>
 <div style="text-align:center;margin-top:30px"><span id="ver" class="muted" style="padding:10px 20px;display:inline-block;user-select:none;-webkit-user-select:none">포켓 스캐너 v${CONFIG.appVersion}</span></div>
 </div></div>`,{nav:true});
 $('#gp').onclick=()=>go('pro');
 $('#mn').onclick=()=>{const a=document.createElement('a');a.href=IOS?'https://apps.apple.com/account/subscriptions':'https://play.google.com/store/account/subscriptions';a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()};
 $('#pp').onclick=()=>dialog('개인정보처리방침',`<div class="muted" style="font-size:13.5px;line-height:1.7;max-height:55vh;overflow:auto">포켓 스캐너는 촬영한 사진과 문서를 기기 안에서만 처리하며, 개발자의 서버로 전송하거나 수집하지 않습니다.<br><br>앱은 무료 이용자에게 Google AdMob 광고를 보여주며, 이 과정에서 Google이 광고 식별자 등 기기 정보를 수집할 수 있습니다. 자세한 내용은 Google 개인정보처리방침을 따릅니다.<br><br>구독 결제는 ${STORE_NAME}를 통해 처리되며, 개발자는 결제 정보를 받지 않습니다.<br><br>문의: ${esc(CONFIG.supportEmail)}</div>`,[{label:'확인',cls:'pri',value:1}]);
 $('#ct').onclick=()=>dialog('문의하기',`<div class="muted" style="font-size:14.5px">아래 메일로 문의해 주세요.</div><div class="result">${esc(CONFIG.supportEmail)}</div>`,[{label:'복사',get:()=>{try{navigator.clipboard.writeText(CONFIG.supportEmail);toast('복사했어요')}catch(e){}}},{label:'확인',cls:'pri',value:1}]);
 $('#ver').onclick=()=>{if(IOS)return;verTaps++;clearTimeout(verTimer);verTimer=setTimeout(()=>verTaps=0,1500);if(verTaps>=7){verTaps=0;go('redeem')}};
};

/* ---------- 숨겨진 코드 입력 ---------- */
VIEWS.redeem=async()=>{
 setView(`<header class="top"><button class="ib" data-back>${ic('back')}</button><h1>이용권 코드</h1><span style="width:40px"></span></header>
 <div class="scroll"><div class="pane">
 <div class="box"><h4>현재 상태</h4><div>${isPro()?`<b style="color:var(--pri)">프로</b> · ${esc(proLabel())}`:'<span class="muted">무료</span>'}</div></div>
 <div class="box"><h4>코드 입력</h4><input class="field" id="cd" placeholder="XXXXX-XXXXX-XXXXX" autocapitalize="characters" autocomplete="off" spellcheck="false" style="font-family:monospace;font-size:18px;letter-spacing:1px;text-align:center"><button class="btn pri" id="go" style="width:100%;margin-top:12px">등록</button></div>
 </div></div>`);
 $('#go').onclick=async()=>{const r=redeemCode($('#cd').value);if(!r.ok)return toast(r.why,3000);await dialog('등록 완료',`<div style="font-size:15px;line-height:1.6"><b>${r.plan.l}</b> 이용권이 적용됐어요.<br><span class="muted">${esc(proLabel())}</span></div>`,[{label:'확인',cls:'pri',value:1}]);render()};
};

/* ---------- native back button ---------- */
if(NATIVE){try{const A=plug('App');A.addListener('backButton',()=>{const m=$$('.mask');if(m.length){m[m.length-1].remove();return}if(busyEl)return;if(stack.length>1)back();else if(curTab!=='home')reset('home');else A.exitApp()})}catch(e){}}

/* ---------- boot ---------- */
(async()=>{setView('<div class="empty" style="margin:auto"><span class="spin" style="display:inline-block"></span></div>');await store.init();DOCS=(await store.all()).sort((a,b)=>b.updated-a.updated);render();adsInit();billingInit()})();
</script>
</body>
</html>
